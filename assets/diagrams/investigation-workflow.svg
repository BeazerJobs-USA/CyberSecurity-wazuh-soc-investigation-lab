<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="100%" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="wfArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1100" height="500" fill="#0b1120"/>

  <text x="550" y="40" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">SOC TRIAGE WORKFLOW: SSH CONFIGURATION FIM ALERT</text>
  <text x="550" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">How I work a Rule 100100 alert, and what each step needs as evidence</text>

  <!-- Step 1 -->
  <g transform="translate(40, 95)">
    <rect width="180" height="250" rx="10" fill="url(#wfGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="180" height="34" rx="10" fill="#0284c7" fill-opacity="0.2"/>
    <text x="90" y="23" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">1. DETECTION</text>
    <circle cx="90" cy="66" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="71" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">FIM</text>
    <text x="90" y="111" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Wazuh FIM event</text>
    <text x="90" y="131" text-anchor="middle" fill="#94a3b8" font-size="11">/etc/ssh/sshd_config</text>
    <text x="90" y="149" text-anchor="middle" fill="#94a3b8" font-size="11">or a *.conf drop-in</text>
    <rect x="12" y="172" width="156" height="62" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="90" y="192" text-anchor="middle" fill="#cbd5e1" font-size="10">Agent → manager</text>
    <text x="90" y="208" text-anchor="middle" fill="#34d399" font-size="10">over Tailscale</text>
    <text x="90" y="224" text-anchor="middle" fill="#7dd3fc" font-size="9.5">(supported, not captured)</text>
  </g>

  <line x1="220" y1="220" x2="248" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- Step 2 -->
  <g transform="translate(255, 95)">
    <rect width="180" height="250" rx="10" fill="url(#wfGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="180" height="34" rx="10" fill="#10b981" fill-opacity="0.2"/>
    <text x="90" y="23" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">2. RULE MATCH</text>
    <circle cx="90" cy="66" r="22" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="71" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">RULE</text>
    <text x="90" y="111" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">550 → custom 100100</text>
    <text x="90" y="131" text-anchor="middle" fill="#94a3b8" font-size="11">Level 8</text>
    <text x="90" y="149" text-anchor="middle" fill="#94a3b8" font-size="11">Case 001: 14 Oct, 01:48:49</text>
    <rect x="12" y="172" width="156" height="62" rx="6" fill="#0f172a" stroke="#065f46"/>
    <text x="90" y="194" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700">Read raw fields</text>
    <text x="90" y="212" text-anchor="middle" fill="#a7f3d0" font-size="10">path · mode · hashes · diff</text>
  </g>

  <line x1="435" y1="220" x2="463" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- Step 3 -->
  <g transform="translate(470, 95)">
    <rect width="180" height="250" rx="10" fill="url(#wfGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <rect width="180" height="34" rx="10" fill="#c084fc" fill-opacity="0.2"/>
    <text x="90" y="23" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="700">3. SCOPE CHECK</text>
    <circle cx="90" cy="66" r="22" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
    <text x="90" y="71" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="700">SOC</text>
    <text x="90" y="111" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Filters + time window</text>
    <text x="90" y="131" text-anchor="middle" fill="#94a3b8" font-size="11">Dashboard: local time</text>
    <text x="90" y="149" text-anchor="middle" fill="#94a3b8" font-size="11">Host logs: UTC</text>
    <rect x="12" y="172" width="156" height="62" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="90" y="194" text-anchor="middle" fill="#cbd5e1" font-size="10">Filtered counters describe</text>
    <text x="90" y="212" text-anchor="middle" fill="#cbd5e1" font-size="10">the filter, not the host</text>
  </g>

  <line x1="650" y1="220" x2="678" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- Step 4 -->
  <g transform="translate(685, 95)">
    <rect width="180" height="250" rx="10" fill="url(#wfGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="180" height="34" rx="10" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="90" y="23" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">4. HOST CHECKS</text>
    <circle cx="90" cy="66" r="22" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="90" y="71" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">CLI</text>
    <text x="90" y="111" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Runbook checks</text>
    <text x="90" y="131" text-anchor="middle" fill="#94a3b8" font-size="11">sshd -t (syntax)</text>
    <text x="90" y="149" text-anchor="middle" fill="#94a3b8" font-size="11">sshd -T (effective config)</text>
    <rect x="12" y="172" width="156" height="62" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="90" y="194" text-anchor="middle" fill="#f59e0b" font-size="10">Status</text>
    <text x="90" y="212" text-anchor="middle" fill="#cbd5e1" font-size="10">pending live evidence</text>
  </g>

  <line x1="865" y1="220" x2="893" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- Step 5 -->
  <g transform="translate(900, 95)">
    <rect width="160" height="250" rx="10" fill="url(#wfGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="160" height="34" rx="10" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="80" y="23" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">5. DISPOSITION</text>
    <circle cx="80" cy="66" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="80" y="71" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">RES</text>
    <text x="80" y="111" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Authorized change?</text>
    <text x="80" y="131" text-anchor="middle" fill="#94a3b8" font-size="11">sudo record + diff</text>
    <text x="80" y="149" text-anchor="middle" fill="#94a3b8" font-size="11">+ my change notes</text>
    <rect x="12" y="172" width="136" height="62" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="80" y="194" text-anchor="middle" fill="#cbd5e1" font-size="10">Case 001</text>
    <text x="80" y="212" text-anchor="middle" fill="#fbbf24" font-size="10">pending</text>
  </g>

  <!-- Evidence threshold -->
  <g transform="translate(40, 368)">
    <rect width="1020" height="112" rx="8" fill="#111a2e" stroke="#334155" stroke-width="1"/>
    <text x="25" y="30" fill="#38bdf8" font-size="12" font-weight="700">EVIDENCE THRESHOLD FOR A DISPOSITION</text>
    <text x="25" y="55" fill="#e2e8f0" font-size="11.5">• Benign (authorized): a matching sudo / command record, the diff or hashes, and a change I meant to make.</text>
    <text x="25" y="78" fill="#e2e8f0" font-size="11.5">• Malicious: an unexpected actor or source, or a change that weakens authentication with no record behind it.</text>
    <text x="25" y="99" fill="#94a3b8" font-size="10.5">A FIM hit on its own is neither. Until one of these is shown, the case stays pending.</text>
  </g>
</svg>
