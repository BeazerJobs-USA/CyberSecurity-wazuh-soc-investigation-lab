  <text x="120" y="190" fill="#ffffff" font-size="54" font-weight="800" letter-spacing="0.5">ENTERPRISE SOC INVESTIGATION LAB</text>
  <text x="120" y="245" fill="#38bdf8" font-size="28" font-weight="700">Cloud Threat Detection, Linux Auditd &amp; Real-Time FIM Pipeline</text>

  <!-- Project Introduction / Context -->
  <text x="120" y="295" fill="#94a3b8" font-size="18.5" font-weight="400">Single-host cloud security lab on Vultr (Ubuntu 22.04 LTS) reporting over Tailscale encrypted mesh VPN to AWS Wazuh SIEM.</text>
  <text x="120" y="325" fill="#94a3b8" font-size="18.5" font-weight="400">Dual case study verification: Auditd configuration detection (Case 001) &amp; Real-time FIM lifecycle testing (Case 002).</text>

