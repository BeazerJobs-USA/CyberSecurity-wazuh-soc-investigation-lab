    <text x="25" y="100" fill="#64748b" font-size="15" font-family="Consolas, monospace">// ruleset: local_rules.xml</text>
    
    <line x1="25" y1="125" x2="500" y2="125" stroke="#334155" stroke-width="1"/>
    
    <g font-size="16">
      <text x="25" y="165" fill="#94a3b8">Rule 100100</text>
      <text x="180" y="165" fill="#f1f5f9">Level 8 (SSH Modified)</text>
      <text x="390" y="165" fill="#34d399" font-size="13" font-weight="700">[FIRED IN LAB]</text>

      <text x="25" y="215" fill="#94a3b8">Rule 100101</text>
      <text x="180" y="215" fill="#f1f5f9">Level 7 (Drop-In Added)</text>
      <text x="390" y="215" fill="#38bdf8" font-size="13" font-weight="700">[VERIFIED]</text>

      <text x="25" y="265" fill="#94a3b8">Rule 100102</text>
      <text x="180" y="265" fill="#f1f5f9">Level 7 (Drop-In Deleted)</text>
      <text x="390" y="265" fill="#38bdf8" font-size="13" font-weight="700">[VERIFIED]</text>

      <text x="25" y="315" fill="#94a3b8">Variable Fix</text>
      <text x="180" y="315" fill="#f1f5f9">$(file) in Alert Description</text>

      <text x="25" y="365" fill="#94a3b8">Verification</text>
      <text x="180" y="365" fill="#34d399">fim_demo.sh Lifecycle Tested</text>

      <text x="25" y="405" fill="#64748b" font-size="13">Validated via Python XML linter and live drop-in harness</text>
