      <text x="185" y="165" fill="#f1f5f9">Auditd SSH Change Alert</text>
      <text x="415" y="165" fill="#34d399" font-size="13" font-weight="700">[EV-01..03]</text>

      <text x="25" y="215" fill="#94a3b8">Auth Failures</text>
      <text x="185" y="215" fill="#e2e8f0">0 in Rule 100100 Scope Only</text>

      <text x="25" y="265" fill="#94a3b8">Context Search</text>
      <text x="185" y="265" fill="#f1f5f9">19 Sudo Events: T1548.003</text>

      <text x="25" y="315" fill="#94a3b8">Case 002</text>
      <text x="185" y="315" fill="#38bdf8" font-weight="600">Real-Time FIM Lifecycle</text>
      <text x="415" y="315" fill="#38bdf8" font-size="13" font-weight="700">[DEMO-01..03]</text>

      <text x="25" y="365" fill="#94a3b8">Lifecycle Test</text>
      <text x="185" y="365" fill="#f1f5f9">Create, Modify &amp; Delete Verified</text>

      <text x="25" y="405" fill="#64748b" font-size="13">Both case studies documented in docs/case-001.md &amp; docs/case-002.md</text>
    </g>
