    <rect x="25" y="0" width="125" height="4" rx="2" fill="#c084fc"/>
    
    <text x="25" y="38" fill="#c084fc" font-size="15" font-weight="700" letter-spacing="0.5">CASE INVESTIGATIONS</text>
    <text x="25" y="70" fill="#ffffff" font-size="22" font-weight="700">Evidence-Backed Cases</text>
    <text x="25" y="100" fill="#64748b" font-size="15" font-family="Consolas, monospace">// Defensible SOC Runbooks</text>
    
    <line x1="25" y1="125" x2="525" y2="125" stroke="#334155" stroke-width="1"/>
    
    <g font-size="16">
