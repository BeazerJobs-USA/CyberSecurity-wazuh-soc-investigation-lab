  <!-- Bottom Divider Line -->
  <line x1="120" y1="920" x2="1800" y2="920" stroke="#334155" stroke-width="1"/>

  <!-- Footer Information -->
  <g transform="translate(120, 955)">
    <text x="0" y="0" fill="#f1f5f9" font-size="16.5" font-weight="700" letter-spacing="0.5">AUTHOR: GEORGE BEAZER  |  CYBERSECURITY STUDENT SENIOR AT KSU</text>
    <text x="0" y="25" fill="#64748b" font-size="14">Evidence-Backed Cybersecurity Portfolio | Single-Host Cloud Lab (Vultr) • Tailscale Mesh VPN • AWS Wazuh SIEM</text>
