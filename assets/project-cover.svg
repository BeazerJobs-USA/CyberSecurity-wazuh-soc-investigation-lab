    <circle cx="22" cy="20" r="6" fill="#10b981"/>
    <text x="38" y="25" fill="#00e5ff" font-size="14.5" font-weight="700" letter-spacing="1">HYBRID CLOUD SECURITY MONITORING &amp; DETECTION LAB</text>
