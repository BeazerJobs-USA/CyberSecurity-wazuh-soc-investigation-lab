# SSH hardening baseline (reference, NOT a dump of the live server).
# The live effective settings have not been captured yet. Capture them with:
#   sudo sshd -T        (what sshd would use if it started now)
#   sudo sshd -t        (syntax check before any reload)
# Keep a second SSH session open while testing so a mistake cannot lock you out.
#
# sshd uses the FIRST value it reads for each keyword. On Ubuntu 22.04 and later
# the default sshd_config begins with "Include /etc/ssh/sshd_config.d/*.conf", and
# drop-ins are read in name order, so a drop-in can override the main file. Some
# cloud images ship drop-ins (for example 50-cloud-init.conf) that set
# PasswordAuthentication. To make these values win, install this file as
# /etc/ssh/sshd_config.d/00-hardening.conf (sorts before 50-*). That is also why
# the FIM rules watch the drop-in directory as well as sshd_config.
#
# Note: sshd -T reads the files on disk. If a file changed but sshd was not
# reloaded, the running daemon may still be using the old values.

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
# KbdInteractiveAuthentication is the OpenSSH 8.7+ name; older releases call it ChallengeResponseAuthentication.
KbdInteractiveAuthentication no
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 4

# Optional. Confirm your own access path before enabling:
# AllowUsers <admin_user>
