# SSH hardening baseline (reference, not a dump of the live server).
# See what is actually in effect with:  sudo sshd -T
# Check syntax before reloading:        sudo sshd -t
# Keep a second SSH session open while testing so a mistake cannot lock you out.
#
# sshd uses the FIRST value it reads for each keyword. On Ubuntu 22.04 and later the
# default sshd_config begins with "Include /etc/ssh/sshd_config.d/*.conf", so a
# drop-in file can override a setting in the main file. Some cloud images ship drop-ins
# (for example 50-cloud-init.conf) that set PasswordAuthentication. That is why the FIM
# rules watch the drop-in directory as well as sshd_config.

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
# KbdInteractiveAuthentication is the OpenSSH 8.7+ name; older releases call it ChallengeResponseAuthentication.
KbdInteractiveAuthentication no
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 4

# Optional. Confirm your own access path before enabling:
# AllowUsers <admin_user>
